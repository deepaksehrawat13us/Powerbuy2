<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Powerbuy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom message box styles */
        #message-box {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem;
            border-radius: 0.5rem;
            color: white;
            z-index: 1000;
            display: none;
            font-weight: 500;
        }
        #message-box.success {
            background-color: #28a745; /* Green */
        }
        #message-box.error {
            background-color: #dc3545; /* Red */
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Create Your Account</h2>
        <form id="signup-form" class="space-y-6">
            <div>
                <label for="fullName" class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="fullName" name="fullName" required
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" required
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="phoneNumber" class="block text-sm font-medium text-gray-700">Phone Number</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" required
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" required
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <button type="submit"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Sign Up
                </button>
            </div>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">
            Already have an account? 
            <a href="/signin.html" class="font-medium text-indigo-600 hover:text-indigo-500">
                Sign In
            </a>
        </p>
    </div>

    <!-- Message Box -->
    <div id="message-box"></div>

    <!-- 
      *** SCRIPT LOADING FIX ***
      Added '?v=1.1' to force the browser to re-download the file.
    -->
    <script src="/session.js?v=1.1"></script>

    <!-- 
      This inline script runs *after* session.js has been loaded, 
      so all functions (like saveUserSession) will be defined.
    -->
    <script>
        // Function to show messages
        function showMessage(message, type) {
            const messageBox = document.getElementById('message-box');
            messageBox.textContent = message;
            messageBox.className = type; // 'success' or 'error'
            messageBox.style.display = 'block';

            // Hide after 3 seconds
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 3000);
        }

        document.getElementById('signup-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Client-side validation
            if (password !== confirmPassword) {
                showMessage('Passwords do not match.', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long.', 'error');
                return;
            }
            
            // --- DEBUG STEP ---
            // Let's check if the function exists RIGHT BEFORE we call it
            if (typeof saveUserSession !== 'function') {
                console.error('saveUserSession is NOT a function right before fetch!');
                showMessage('A page error occurred. Please refresh and try again.', 'error');
                return;
            }
            // --- END DEBUG STEP ---

            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        fullName: fullName, 
                        email: email, 
                        phoneNumber: phoneNumber,
                        password: password,
                        confirmPassword: confirmPassword 
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    // 1. Show success message
                    showMessage('Sign up successful! Redirecting to home page...', 'success');
                    
                    // 2. Save the user session (this will be defined)
                    saveUserSession(result.user); 
                    
                    // 3. Redirect to the home page
                    setTimeout(() => {
                        window.location.href = '/index.html'; // Redirect to home
                    }, 2000);
                } else {
                    // Show error message from server
                    showMessage(result.message || 'An error occurred.', 'error');
                }
            } catch (error) {
                console.error('Error during sign up:', error);
                showMessage('Failed to connect to the server.', 'error');
            }
        });
    </script>
</body>
</html>
