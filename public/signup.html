<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up | PowerBuy</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>

<body class="bg-gray-50 text-gray-900">

  <!-- NAVBAR -->
  <header class="sticky top-0 bg-white border-b shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center h-16 px-4 sm:px-6 lg:px-8">
      <a href="index.html" class="text-2xl font-bold">PowerBuy</a>
    </div>
  </header>

  <!-- SIGN-UP SECTION -->
  <main class="max-w-md mx-auto mt-10 bg-white rounded-2xl shadow p-8">
    <h2 class="text-3xl font-bold mb-4 text-center">Create Your Account</h2>
    <p class="text-sm text-gray-600 text-center mb-6">
      We respect your privacy. We only ask for your name, email, and phone number.
      <br>No other data is collected or shared.
    </p>

    <form id="signupForm" class="space-y-4">
      <input type="text" name="name" placeholder="Full Name" required
             class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">

      <input type="email" name="email" placeholder="Email Address" required
             class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">

      <input type="tel" name="phone" id="phone" placeholder="Phone Number" required
             pattern="[0-9]{10}" maxlength="10"
             class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">

      <input type="tel" name="confirmPhone" id="confirmPhone" placeholder="Confirm Phone Number" required
             pattern="[0-9]{10}" maxlength="10"
             class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">

      <button type="submit"
              class="w-full bg-black text-white rounded-lg py-2 font-semibold hover:bg-gray-800 transition">
        Sign Up
      </button>
    </form>

    <p id="msg" class="text-center mt-4 text-sm text-green-600 hidden">✅ Signed up successfully!</p>
  </main>

  <!-- FOOTER -->
  <footer class="text-center py-6 text-sm text-gray-500">
    © <span id="year"></span> PowerBuy. All Rights Reserved.
  </footer>

  <!-- SCRIPT -->
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    const form = document.getElementById("signupForm");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const phone = document.getElementById("phone").value.trim();
      const confirmPhone = document.getElementById("confirmPhone").value.trim();

      if (phone !== confirmPhone) {
        msg.textContent = "❌ Phone numbers do not match.";
        msg.classList.remove("hidden", "text-green-600");
        msg.classList.add("text-red-600");
        return;
      }

      msg.textContent = "Submitting...";
      msg.classList.remove("hidden", "text-red-600");
      msg.classList.add("text-gray-600");

      // 🪵 Debug log before the request
      const formData = Object.fromEntries(new FormData(form));
      console.log("Submitting signup:", formData);

      try {
        // ✅ Correct API endpoint (not signup.html)
        const res = await fetch("/api/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(formData),
        });

        if (res.ok) {
          msg.textContent = "✅ Signed up successfully!";
          msg.classList.replace("text-gray-600", "text-green-600");
          form.reset();
        } else {
          msg.textContent = "❌ Error: Unable to sign up.";
          msg.classList.replace("text-gray-600", "text-red-600");
        }
      } catch (err) {
        console.error("❌ Network or server error:", err);
        msg.textContent = "❌ Network error.";
        msg.classList.replace("text-gray-600", "text-red-600");
      }
    });
  </script>
</body>
</html>
