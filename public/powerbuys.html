<!doctype html>
<html lang="en">

  <style> body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; } </style>

  <!-- UNIVERSAL HEADER -->

      <!-- *** END UPDATED LOGO *** -->
      
      <!-- *** ID ADDED *** -->

        <a href="#contact" class="hover:text-gray-500">Contact Us</a>
        <a href="powerbuys.html" class="text-indigo-600 font-bold">Pools</a>
        <a href="dashboard.html" class="hover:text-gray-500">My Pools</a>
        <a href="signin.html" class="hover:text-gray-500">Sign In</a>
        <a href="signup.html" class="hover:text-gray-500">Sign Up</a>
      </nav>
      <button id="menuBtn" class="md:hidden border px-3 py-2 rounded-lg text-sm">☰</button>

  <!-- MAIN SECTION -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <h2 class="text-3xl font-extrabold text-center">Active Pools</h2>
    <p class="text-gray-600 text-center mt-2">Once a pool closes, we negotiate bulk pricing and call all participants with the lowest price.</p>

    <!-- Filters -->
    <div class="mt-8 flex flex-col md:flex-row items-center justify-between gap-4">
      <input id="searchInput" type="text" placeholder="Search by brand name..."
             class="w-full md:w-1/2 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none" />
      <select id="categoryFilter" class="border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
        <option value="all">All Categories</option>
        <option value="car">Cars</option>
        <option value="phone">Phones</option>
      </select>
    </div>

    <!-- PowerBuys Grid -->
    <div id="powerbuyList" class="mt-10 grid sm:grid-cols-2 lg:grid-cols-3 gap-6 text-center"></div>
  </section>

  <!-- JOIN FORM MODAL -->
  <div id="joinModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">

      <h3 class="text-2xl font-bold mb-4 text-center">Join Pool</h3>
      <form id="joinForm" class="space-y-4">
        <input type="hidden" id="joinBrand" name="brand" />
        <input type="hidden" id="joinType" name="type" />

        <!-- Dynamic specs fields -->
        <div id="dynamicSpecs" class="space-y-4"></div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Additional Notes (Optional)</label>
          <textarea id="notes" name="notes" rows="3"
                    class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"
                    placeholder="Any preferences, color, variant, etc."></textarea>
        </div>

        <div class="flex justify-end gap-3 mt-4">
          <button type="button" id="cancelJoin"
                  class="px-4 py-2 border rounded-lg text-gray-700 hover:bg-gray-100">
            Cancel
          </button>
          <button type="submit"
                  class="px-4 py-2 bg-black text-white rounded-lg hover:bg-gray-800">
            Join Now
          </button>
        </div>
      </form>
    </div>
  </div>


  <!-- FOOTER -->

  <!-- Load configuration and session management -->
  <script src="/config.js"></script>
  <script src="/session.js?v=2.0"></script>

  <script>
    // Get user from session.js function
    let user = getUserSession(); 

    // PowerBuys data - will be fetched from API
    let powerbuys = [];

    const listContainer = document.getElementById("powerbuyList");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const joinModal = document.getElementById("joinModal");
    const joinForm = document.getElementById("joinForm");
    const cancelJoin = document.getElementById("cancelJoin");
    const joinBrand = document.getElementById("joinBrand");
    const joinType = document.getElementById("joinType");
    const dynamicSpecs = document.getElementById("dynamicSpecs");

    // Fetch active pools from API
    async function fetchActivePools() {
      try {
        listContainer.innerHTML = '<p class="text-gray-500 text-center col-span-full">Loading active Pools...</p>';
        
        const response = await fetch(getApiUrl(API_CONFIG.endpoints.getActivePools));
        
        if (!response.ok) {
          throw new Error('Failed to fetch pools');
        }

        const data = await response.json();
        
        // Log the API response
        console.log('Active Pools API Response:', data);
        console.log(`Fetched ${data.data?.length || 0} active pools`);
        
        powerbuys = (data.data || []).map(pool => ({
          id: pool.id,
          poolId: pool.id,
          brand: pool.brand_name || 'Unknown Brand',
          type: pool.category_slug || 'other',
          categoryName: pool.category_name || '',
          joinBy: pool.closing_date ? new Date(pool.closing_date).toLocaleDateString() : 'TBD',
          timeRemaining: pool.time_remaining || '',
          participants: pool.current_participants || 0,
          maxParticipants: pool.max_participants || 0,
          status: pool.status || 'active',
          brandLogo: pool.brand_logo || ''
        }));
        
        console.log('Mapped pools:', powerbuys);
        
        renderList();
      } catch (error) {
        console.error('Error fetching pools:', error);
        listContainer.innerHTML = '<p class="text-red-500 text-center col-span-full">Failed to load Pools. Please try again later.</p>';
      }
    }

    function renderList() {
      const search = searchInput.value.toLowerCase();
      const category = categoryFilter.value.toLowerCase();
      
      console.log('Filtering - Category:', category, 'Search:', search);
      
      const filtered = powerbuys.filter(pb => {
        const matchesSearch = pb.brand.toLowerCase().includes(search);
        const matchesCategory = category === "all" || pb.type.toLowerCase() === category;
        console.log(`Pool: ${pb.brand}, Type: ${pb.type}, Matches: ${matchesSearch && matchesCategory}`);
        return matchesSearch && matchesCategory;
      });

      console.log('Filtered results:', filtered.length);

      listContainer.innerHTML = filtered.map(pb => `
        <div class="bg-white rounded-2xl border shadow-sm p-6 flex flex-col justify-between">
          <div>
            <h3 class="text-xl font-semibold">${pb.brand}</h3>
            <p class="text-gray-600 mt-1 capitalize">Category: ${pb.categoryName || pb.type}</p>
            <p class="text-gray-600 mt-1">Closing Date: <strong>${pb.joinBy}</strong></p>
            ${pb.timeRemaining ? `<p class="text-gray-600 mt-1">Time Remaining: <strong class="text-indigo-600">${pb.timeRemaining}</strong></p>` : ''}
            ${pb.participants || pb.maxParticipants ? `<p class="text-gray-600 mt-1">Participants: <strong>${pb.participants}${pb.maxParticipants ? '/' + pb.maxParticipants : ''}</strong></p>` : ''}
          </div>
          <button onclick="openJoinForm('${pb.poolId}', '${pb.brand}','${pb.type}')"
            class="mt-5 bg-black text-white px-4 py-2 rounded-lg font-semibold hover:bg-gray-800">
            Join Pool
          </button>
        </div>
      `).join("");

      if (filtered.length === 0)
        listContainer.innerHTML = `<p class="text-gray-500 text-center col-span-full">No PowerBuys found.</p>`;
    }

    // Initialize: Fetch pools on page load
    fetchActivePools();

    // *** UPDATED *** This function is now much more comprehensive

      console.log('typeof getUserSession:', typeof getUserSession);
      
      // Check if session functions are available
      if (typeof isLoggedIn !== 'function' || typeof getUserSession !== 'function') {
        console.error('Session functions not loaded! Redirecting to signin...');
        window.location.href = "signin.html";
        return;

      const userSession = getUserSession();
      const loggedIn = isLoggedIn();

            break;

             models = `

            trims = `

            colors = `

      dynamicSpecs.innerHTML = specsHtml;

      joinModal.classList.remove("hidden");
      joinModal.classList.add("flex");
    }

    cancelJoin.addEventListener("click", () => {
      joinModal.classList.add("hidden");
      joinModal.classList.remove("flex");
    });

    joinForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const specs = {};
      document.querySelectorAll("#dynamicSpecs select").forEach(sel => specs[sel.name] = sel.value);

      // *** UPDATED *** Get full user info from session
      const powerbuyId = `${joinBrand.value} - ${specs.Model || joinType.value}`; // Create a unique-ish ID

      const formData = {
        fullName: user.fullName,
        email: user.email,
        phoneNumber: user.phoneNumber, // Send phone number from session
        powerbuyId: powerbuyId, // Send the more descriptive ID
        brand: joinBrand.value,
        type: joinType.value,
        specs,
        notes: document.getElementById("notes").value
      };

      try {
        // *** UPDATED *** Send to the correct '/join' endpoint
        const res = await fetch("/join", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(formData)
        });
        const data = await res.json();

        if (res.ok) {
          alert(`✅ Joined ${formData.powerbuyId} PowerBuy successfully!`); // Use alert as placeholder
          joinModal.classList.add("hidden");
          joinModal.classList.remove("flex");
          // Optionally, redirect to dashboard
          window.location.href = '/dashboard.html';
        } else {
          alert(`❌ ${data.message || "Unable to join PowerBuy."}`); // Use alert as placeholder
        }
      } catch (err) {
        console.error(err);
        alert("Network error. Try again later."); // Use alert as placeholder
      }
    });

    // --- Logic to read URL parameters ---
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const brand = urlParams.get('brand');
        const type = urlParams.get('type');

        if (brand) {
            searchInput.value = brand;
        }
        if (type) {
            categoryFilter.value = type;
        }
        
        // Render list with pre-filled filters
        renderList();
    });

    searchInput.addEventListener("input", renderList);
    categoryFilter.addEventListener("change", renderList);
    
    // Initial render on page load
    renderList();
  </script>

</body>
</html>
