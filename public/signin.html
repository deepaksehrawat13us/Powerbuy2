<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In | PowerBuy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> 
    body { font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; } 
  </style>
</head>
<body class="bg-gray-50 text-gray-900">

  <!-- NAVBAR -->
  <header class="sticky top-0 bg-white border-b shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center h-16 px-4 sm:px-6 lg:px-8">
      <a href="index.html" class="text-2xl font-bold">PowerBuy</a>
    </div>
  </header>

  <!-- SIGN IN FORM -->
  <main class="max-w-md mx-auto mt-10 bg-white rounded-2xl shadow p-8">
    <h2 class="text-3xl font-bold mb-4 text-center">Sign In</h2>
    <p class="text-sm text-gray-600 text-center mb-6">
      Welcome back! Enter your phone number to receive an OTP.
    </p>

    <!-- Step 1: Phone Number Form -->
    <form id="phoneForm" class="space-y-4">
      <div>
        <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
        <input type="tel" id="phone" name="phone_number" placeholder="9876543210" required
               pattern="^[6-9]\d{9}$"
               class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
        <p class="text-xs text-gray-500 mt-1">Enter 10-digit mobile number (e.g., 9876543210)</p>
      </div>

      <button type="submit" id="sendOtpBtn"
              class="w-full bg-black text-white rounded-lg py-2 font-semibold hover:bg-gray-800 transition">
        Send OTP
      </button>
    </form>

    <!-- Step 2: OTP Verification Form (Initially Hidden) -->
    <form id="otpForm" class="space-y-4 hidden">
      <div>
        <label class="block text-sm text-gray-600 mb-2">
          Enter the 6-digit OTP sent to your phone
        </label>
        <input type="text" id="otp" name="otp" placeholder="Enter OTP" required
               pattern="[0-9]{6}" maxlength="6"
               class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none text-center text-2xl tracking-widest">
      </div>

      <button type="submit" id="verifyOtpBtn"
              class="w-full bg-black text-white rounded-lg py-2 font-semibold hover:bg-gray-800 transition">
        Verify & Sign In
      </button>

      <button type="button" id="backBtn"
              class="w-full border border-gray-300 text-gray-700 rounded-lg py-2 font-semibold hover:bg-gray-50 transition">
        Change Phone Number
      </button>

      <p class="text-center text-sm text-gray-600">
        Didn't receive OTP? 
        <button type="button" id="resendBtn" disabled class="text-indigo-600 font-semibold hover:underline disabled:text-gray-400 disabled:no-underline">
          Resend (<span id="countdown">30</span>s)
        </button>
      </p>
    </form>

    <p id="msg" class="text-center mt-4 text-sm text-gray-600 hidden"></p>

    <p class="text-sm text-center mt-6 text-gray-600">
      Don't have an account? <a href="signup.html" class="text-indigo-600 font-semibold hover:underline">Sign up</a>
    </p>
  </main>

  <footer class="text-center py-6 text-sm text-gray-500">
    © <span id="year"></span> PowerBuy. All Rights Reserved.
  </footer>

  <!-- Load configuration and session management -->
  <script src="/config.js"></script>
  <script src="/session.js?v=2.0"></script>
  
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const phoneForm = document.getElementById("phoneForm");
    const otpForm = document.getElementById("otpForm");
    const backBtn = document.getElementById("backBtn");
    const resendBtn = document.getElementById("resendBtn");
    const countdownSpan = document.getElementById("countdown");
    const msg = document.getElementById("msg");
    
    // Country code configuration
    const COUNTRY_CODE = '+91';
    
    let userPhoneNumber = '';
    let countdownTimer = null;

    // Function to show message
    function showMsg(text, isError = false) {
      msg.classList.remove("hidden");
      msg.textContent = text;
      msg.classList.remove("text-red-600", "text-green-600", "text-gray-600");
      msg.classList.add(isError ? "text-red-600" : "text-gray-600");
    }

    // Countdown timer for resend OTP
    function startCountdown(seconds = 30) {
      resendBtn.disabled = true;
      let remaining = seconds;
      countdownSpan.textContent = remaining;

      countdownTimer = setInterval(() => {
        remaining--;
        countdownSpan.textContent = remaining;
        if (remaining <= 0) {
          clearInterval(countdownTimer);
          resendBtn.disabled = false;
          countdownSpan.textContent = "0";
        }
      }, 1000);
    }

    // Function to send OTP
    async function sendOTP() {
      showMsg("Sending OTP...");

      try {
        const res = await fetch(getApiUrl(API_CONFIG.endpoints.sendLoginOTP), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            phone_number: userPhoneNumber,
            action: 'login'
          }),
        });

        const data = await res.json();

        if (res.ok) {
          showMsg("✅ OTP sent to your phone!");
          msg.classList.add("text-green-600");
          
          // Show OTP form, hide phone form
          phoneForm.classList.add("hidden");
          otpForm.classList.remove("hidden");
          
          // Start countdown
          startCountdown(30);
          
          // Focus on OTP input
          setTimeout(() => document.getElementById("otp").focus(), 100);
        } else {
          showMsg(`❌ ${data.message || data.error || 'Failed to send OTP'}`, true);
        }
      } catch (err) {
        console.error('Error sending OTP:', err);
        showMsg("❌ Network error. Try again later.", true);
      }
    }

    // Step 1: Send OTP
    phoneForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const phoneInput = document.getElementById("phone");
      const phoneNumber = phoneInput.value.trim();

      // Validate phone number format (10 digits starting with 6-9)
      const phonePattern = /^[6-9]\d{9}$/;
      if (!phonePattern.test(phoneNumber)) {
        showMsg("❌ Please enter a valid 10-digit mobile number starting with 6-9.", true);
        return;
      }

      // Add country code before sending to API
      userPhoneNumber = COUNTRY_CODE + phoneNumber;

      await sendOTP();
    });

    // Step 2: Verify OTP and Authenticate
    otpForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      showMsg("Verifying OTP...");

      const otpInput = document.getElementById("otp");
      const otp = otpInput.value.trim();

      try {
        const res = await fetch(getApiUrl(API_CONFIG.endpoints.authenticate), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            phone_number: userPhoneNumber,
            otp: otp 
          }),
        });

        const data = await res.json();

        if (res.ok && data.data) {
          showMsg("✅ Signed in successfully!");
          msg.classList.add("text-green-600");
          
          // Save user session with tokens
          const user = data.data.user;
          const tokens = data.data.tokens;
          
          saveUserSession(user, tokens.access_token, tokens.refresh_token);
          
          // Redirect to home page
          setTimeout(() => (window.location.href = "index.html"), 1000);
        } else {
          showMsg(`❌ ${data.message || data.error || 'Invalid OTP'}`, true);
        }
      } catch (err) {
        console.error('Error verifying OTP:', err);
        showMsg("❌ Network error. Try again later.", true);
      }
    });

    // Back button - return to phone form
    backBtn.addEventListener("click", () => {
      phoneForm.classList.remove("hidden");
      otpForm.classList.add("hidden");
      msg.classList.add("hidden");
      document.getElementById("otp").value = '';
      if (countdownTimer) {
        clearInterval(countdownTimer);
      }
    });

    // Resend OTP button
    resendBtn.addEventListener("click", async () => {
      await sendOTP();
    });
  </script>
</body>
</html>
