<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My PowerBuys | PowerBuy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>

<body class="bg-gray-50 text-gray-900">

  <!-- HEADER -->
  <header class="sticky top-0 bg-white border-b shadow-sm z-10">
    <div class="max-w-7xl mx-auto flex justify-between items-center h-16 px-4 sm:px-6 lg:px-8">
      <a href="index.html" class="text-2xl font-bold text-black">PowerBuy</a>
      <nav class="hidden md:flex space-x-6 text-sm font-semibold items-center">
        <a href="index.html#how" class="hover:text-gray-500">How it Works</a>
        <a href="powerbuys.html" class="hover:text-gray-500">PowerBuys</a>
        <a href="dashboard.html" class="text-indigo-600 font-bold">My PowerBuys</a>
        <a href="signin.html" class="hover:text-gray-500">Sign In</a>
        <a href="signup.html" class="hover:text-gray-500">Sign Up</a>
      </nav>
      <button id="menuBtn" class="md:hidden border px-3 py-2 rounded-lg text-sm">☰</button>
    </div>
    <div id="mobileMenu" class="hidden md:hidden border-t bg-white">
      <a href="index.html#how" class="block px-4 py-2 hover:bg-gray-100">How it Works</a>
      <a href="powerbuys.html" class="block px-4 py-2 hover:bg-gray-100">PowerBuys</a>
      <a href="dashboard.html" class="block px-4 py-2 hover:bg-gray-100 font-bold text-indigo-600">My PowerBuys</a>
      <a href="signin.html" class="block px-4 py-2 hover:bg-gray-100">Sign In</a>
      <a href="signup.html" class="block px-4 py-2 hover:bg-gray-100">Sign Up</a>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <h2 class="text-3xl font-extrabold text-center mb-6">My PowerBuys</h2>
    <div id="dashboardContainer" class="text-center text-gray-500">Loading your PowerBuys...</div>
  </section>

  <!-- FOOTER -->
  <footer class="py-6 text-center text-sm text-gray-500 border-t mt-10">
    © <span id="year"></span> PowerBuy. All Rights Reserved.
  </footer>

  <!-- SCRIPT -->
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const menuBtn = document.getElementById("menuBtn");
    const mobileMenu = document.getElementById("mobileMenu");
    menuBtn?.addEventListener("click", () => mobileMenu.classList.toggle("hidden"));

    const user = JSON.parse(localStorage.getItem("powerbuyUser"));
    const dashboardContainer = document.getElementById("dashboardContainer");

    if (!user) {
      dashboardContainer.innerHTML = `
        <div class="bg-white rounded-xl shadow-sm p-6 max-w-md mx-auto">
          <p class="text-gray-700 mb-4">Please sign in to view your PowerBuys.</p>
          <a href="signin.html" class="bg-black text-white px-5 py-2 rounded-lg font-semibold hover:bg-gray-800">Sign In</a>
        </div>`;
    } else {
      loadUserPowerBuys();
    }

    async function loadUserPowerBuys() {
      try {
        const res = await fetch("/api/user-powerbuys");
        const data = await res.json();

        const myPowerbuys = data.filter(join => join.user.email === user.email);

        if (myPowerbuys.length === 0) {
          dashboardContainer.innerHTML = `
            <div class="bg-white rounded-xl shadow-sm p-6 max-w-md mx-auto">
              <p class="text-gray-700 mb-4">You haven’t joined any PowerBuys yet.</p>
              <a href="powerbuys.html" class="bg-black text-white px-5 py-2 rounded-lg font-semibold hover:bg-gray-800">Explore PowerBuys</a>
            </div>`;
          return;
        }

        dashboardContainer.innerHTML = `
          <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
            ${myPowerbuys.map(join => `
              <div class="bg-white rounded-xl border shadow-sm p-6 text-left">
                <h3 class="text-xl font-bold mb-2">${join.powerbuy.brand}</h3>
                <p class="text-gray-600 capitalize mb-2">Category: ${join.powerbuy.type}</p>
                <div class="text-sm text-gray-700 space-y-1">
                  ${Object.entries(join.specs || {}).map(([k, v]) => `<p><strong>${k}:</strong> ${v}</p>`).join("")}
                </div>
                ${join.notes ? `<p class="mt-2 text-sm text-gray-500">Note: ${join.notes}</p>` : ""}
                <p class="mt-2 text-xs text-gray-400">Joined: ${new Date(join.timestamp || join.joinedAt).toLocaleString()}</p>
                <button class="mt-4 bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600"
                        onclick="leavePowerbuy('${join.powerbuy.brand}','${join.powerbuy.type}')">
                  Leave PowerBuy
                </button>
              </div>
            `).join("")}
          </div>`;
      } catch (err) {
        console.error("Error loading PowerBuys:", err);
        dashboardContainer.innerHTML = `
          <p class="text-red-600">Error loading your PowerBuys. Please try again later.</p>`;
      }
    }

    async function leavePowerbuy(brand, type) {
      if (!confirm(`Are you sure you want to leave the ${brand} ${type} PowerBuy?`)) return;

      try {
        const res = await fetch("/api/leave-powerbuy", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: user.email, brand, type })
        });

        const data = await res.json();
        if (res.ok) {
          alert("✅ You have left this PowerBuy.");
          loadUserPowerBuys();
        } else {
          alert(`❌ ${data.error || "Unable to leave PowerBuy."}`);
        }
      } catch (err) {
        console.error(err);
        alert("Network error. Try again later.");
      }
    }
  </script>

  <script src="session.js"></script>
</body>
</html>
